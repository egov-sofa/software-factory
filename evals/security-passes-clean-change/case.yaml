schema_version: "1.0"
name: security-passes-clean-change
description: >-
  Control of security-finds-key-and-sqli: the same plan with a parameterized query and the S3 settings read from the
  environment. The auditor must pass it without a blocking finding, so an auditor that flags everything does not
  score well.
tags: [security, control, portable]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the security-auditor subagent to audit this branch against the base branch `main`. The plan is
    `docs/plans/2026-11-19-find-user.md`, and the review folder is `.git/factory-review/` (it holds changes.diff,
    files.txt and checks.txt). Give me its report unchanged.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Agent, Read, Grep, Glob]
runs: 3
graders:
  - type: regex
    name: passed
    target: trace
    pattern: 'Verdict:\s*PASS'
  - type: regex
    name: no-blocking-finding
    target: last_message
    pattern: '\[(CRITICAL|HIGH)\]'
    match: not_contains
  - type: tool_used
    name: auditor-used
    tool: Agent
    input_match: security-auditor
    min: 1
    arm: with-only
