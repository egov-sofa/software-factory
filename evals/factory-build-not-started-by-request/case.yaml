schema_version: "1.0"
name: factory-build-not-started-by-request
description: >-
  A plain feature request must not start /factory-build: the skill has disable-model-invocation, so it runs only when
  the user types it (I23). Scores 1.0 in both arms by design; a regression shows as the with-plugin arm dropping.
tags: [skill, trigger, core, portable]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a --verbose flag to the CLI.
  max_turns: 6
  timeout_seconds: 600
  allowed_tools: [Agent, Read, Grep, Glob, Skill]
runs: 3
graders:
  # arm: both, or a Skill grader only indicates whether the plugin fired and is not scored
  - type: tool_used
    name: factory-build-not-invoked
    tool: Skill
    input_match: factory-build
    min: 0   # min defaults to 1, which no run with max 0 can meet (smoke run 1)
    max: 0
    arm: both
  - type: regex
    name: no-pipeline-text
    target: trace
    pattern: 'Factory Build Pipeline'
    match: not_contains
