schema_version: "1.0"
name: reviewer-finds-off-by-one
description: >-
  The reviewer reviews a pagination change whose paginate() drops the last item of every page, while the tests and
  checks.txt are green. It must request changes with a blocking finding on paginate.py.
tags: [reviewer, core, portable]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the reviewer subagent to review this branch against the base branch `main`. The plan is
    `docs/plans/2026-11-19-paginate.md`, and the review folder is `.git/factory-review/` (it holds changes.diff,
    files.txt and checks.txt). Give me its report unchanged.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Agent, Read, Grep, Glob]
runs: 3
graders:
  # the reviewer's report header and finding format (claude/agents/reviewer.md)
  - type: regex
    name: changes-requested
    target: trace
    pattern: 'Verdict:\s*CHANGES_REQUESTED'
  - type: regex
    name: blocking-finding-on-paginate
    target: trace
    pattern: '\[(BLOCKER|MAJOR)\][^\n\\]{0,60}paginate\.py:\d+'
  - type: tool_used
    name: reviewer-used
    tool: Agent
    input_match: reviewer
    min: 1
    arm: with-only
  - type: llm
    name: names-the-dropped-item
    criteria: >-
      The review says that paginate() drops the last item of each page (for example: with 7 items and size 3, page 1
      returns 2 items, and the 7th item is on no page), and treats it as a bug that must be fixed before merging.
