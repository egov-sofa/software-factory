# Source of claude-services-auth.drawio and claude-services-auth-1..3.png (docs/CLAUDE-SERVICES-AUTH.md).
# Regenerate: bash docs/diagrams/build.sh claude-services-auth
diagram:
  title: Claude services, authentication
  statement: A review run stores no key; GitHub signs who the run is, and a rule for that repository swaps it for a short-lived token.
  notation: c4
  viewpoint: solution
  status: approved
  version: "2"
  author: software-factory
  date: 2026-11-19
pages:
  - name: Run
    title: How a review run reaches the Claude API
    statement: GitHub signs who the run is; the repository's federation rule swaps that for a 10-minute token acting as one service account in one workspace.
    flow: left-to-right
    items:
      - container: run
        kind: zone
        name: GitHub Actions run, project repo
        layout: column
        items:
          - {node: caller, kind: component, name: claude-review.yml, qualifier: "variables: rule, org, account"}
          - {node: action, kind: component, name: claude-code-action, qualifier: "in reusable-claude-review @v1"}
      - container: github
        kind: external
        name: GitHub
        layout: column
        items:
          - {node: oidc, kind: external-system, name: OIDC issuer, qualifier: "signs a JWT, about 5 min"}
      - container: org
        kind: system-boundary
        name: Anthropic organization
        layout: column
        items:
          - {node: rule, kind: component, name: Federation rule, qualifier: "one per repo and workflow"}
          - {node: account, kind: component, name: Service account, qualifier: "svac_, no login"}
          - {node: workspace, kind: component, name: Workspace, qualifier: "wrkspc_, spend limit"}
          - {node: api, kind: system, name: Claude API, qualifier: billed to the workspace}
    edges:
      - {from: caller, to: action, kind: sync, label: "passes the IDs"}
      - {from: action, to: oidc, kind: identity, label: "id-token: write", ports: {exit: [1, 0.25], entry: [0, 0.5]}}
      - {from: action, to: rule, kind: identity, label: exchanges the JWT, primary: true, ports: {exit: [1, 0.75], entry: [0, 0.5]}}
      - {from: rule, to: account, kind: sync, label: mints a token for}
      - {from: account, to: workspace, kind: sync, label: member of}
      - {from: action, to: api, kind: sync, label: "10-minute token", primary: true, ports: {exit: [0.5, 1], entry: [0, 0.5]}}
  - name: Objects
    title: What is shared and what is per repository
    statement: The issuer is set up once per organization, the workspace and service account once per team; every repository gets its own rules and variables.
    flow: left-to-right
    items:
      - container: gh
        kind: zone
        name: GitHub
        layout: column
        items:
          - {node: repo-a, kind: component, name: Project repo A, qualifier: "5 variables, no secret"}
          - {node: repo-b, kind: component, name: Project repo B, qualifier: "5 variables, no secret"}
          - {node: oidc2, kind: external-system, name: OIDC issuer, qualifier: "signs each run's token"}
      - container: anth
        kind: system-boundary
        name: Anthropic organization
        layout: row
        items:
          - container: per-repo
            kind: zone
            name: Once per repository
            layout: column
            items:
              - {node: rule-a, kind: component, name: repo-a-pr-review, qualifier: "+ optional -pr-mention"}
              - {node: rule-b, kind: component, name: repo-b-pr-review, qualifier: "+ optional -pr-mention"}
          - container: per-team
            kind: zone
            name: Once per team
            layout: column
            items:
              - {node: account2, kind: component, name: Service account, qualifier: "svac_, no login"}
              - {node: workspace2, kind: component, name: Workspace, qualifier: "wrkspc_, spend limit"}
          - container: per-org
            kind: zone
            name: Once per organization
            layout: column
            items:
              - {node: issuer, kind: component, name: Federation issuer, qualifier: "trusts GitHub's tokens"}
    edges:
      - {from: repo-a, to: rule-a, kind: identity, label: "rule ID in a variable", primary: true}
      - {from: repo-b, to: rule-b, kind: identity, label: "rule ID in a variable"}
      - {from: rule-a, to: account2, kind: sync, label: mints tokens for}
      - {from: rule-b, to: account2, kind: sync, label: mints tokens for}
      - {from: account2, to: workspace2, kind: sync, label: member of}
      - {from: oidc2, to: issuer, kind: identity, label: trusted by}
  - name: Setup
    title: Setting a repository up, in one command
    statement: Claude Code previews the rules; the organization admin runs one command that creates the rules and sets the variables, review switch last.
    flow: left-to-right
    items:
      - container: people
        kind: group
        layout: column
        items:
          - {node: admin, kind: person, name: Organization admin, qualifier: "org:admin login"}
      - container: ways
        kind: group
        layout: column
        items:
          - container: scripted
            kind: zone
            name: "Recommended: script, from Claude Code"
            layout: column
            items:
              - {node: claude, kind: component, name: Claude Code skill, qualifier: "factory-new or -onboard"}
              - {node: script, kind: component, name: claude_federation.py, qualifier: "--apply --set-variables"}
          - container: console
            kind: zone
            name: "By hand: Claude Console"
            items:
              - {node: wizard, kind: component, name: Workload identity, qualifier: "rule form, then gh variable set"}
      - container: org
        kind: system-boundary
        name: Anthropic organization
        layout: column
        items:
          - {node: adminapi, kind: component, name: Admin API, qualifier: "beta, org:admin only"}
          - {node: rules, kind: component, name: Federation rules, qualifier: "review, mention"}
      - container: repo
        kind: zone
        name: Project repo on GitHub
        layout: column
        items:
          - {node: vars, kind: data-store, name: Repo variables, qualifier: "review switch last"}
    edges:
      - {from: claude, to: admin, kind: sync, label: "previews, hands over one command"}
      - {from: admin, to: script, kind: sync, label: runs, primary: true}
      - {from: script, to: adminapi, kind: sync, label: creates rules, primary: true}
      - {from: adminapi, to: rules, kind: sync, label: stores}
      - {from: script, to: vars, kind: file, label: "gh variable set", primary: true}
      - {from: admin, to: wizard, kind: sync, label: or fills in}
      - {from: wizard, to: rules, kind: sync, label: creates}
