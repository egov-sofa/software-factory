[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Dev-only tools (PEP 735): `uv add --dev <tool>` adds one, `uv sync` installs them. uv.lock pins every version.
[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE_NAME}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
# Type hints on every public function (CLAUDE.md): strict for the application code, run in CI
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
# A copy of the software-factory content guard: maintained in the factory, not here, so this project's lint and
# format rules do not apply to it (CI runs the factory's own copy anyway).
extend-exclude = ["scripts/check_content.py"]

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern syntax, S: security
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
