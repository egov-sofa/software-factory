# Docs dashboard: every Monday, scans the documentation of every repository in registry.yml through the GitHub API and
# keeps one issue in this repository, labelled docs-drift, as the overview of all projects. Closes it when every
# document everywhere is fine. Setup: docs/DOCS-DRIFT.md in the software factory.
#
# A GitHub App token covers one owner (organization or user). Add one "Token for ..." step per owner in registry.yml,
# and pass each token as DOCS_DRIFT_TOKEN_<OWNER>: upper case, - becomes _.
#
# Once the factory is internal or private, the checkout of its scripts needs a token too: set the variable
# FACTORY_APP_CLIENT_ID and the secret FACTORY_APP_PRIVATE_KEY (a GitHub App with Contents read on the factory).
name: Docs dashboard

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Token for example-org
        id: example_org
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DRIFT_APP_PRIVATE_KEY }}
          owner: example-org
          permission-contents: read

      - name: Token for other-org
        id: other_org
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DRIFT_APP_PRIVATE_KEY }}
          owner: other-org
          permission-contents: read

      - name: Token to read the factory
        id: factory
        if: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: egov-sofa
          repositories: software-factory
          permission-contents: read

      - name: The factory's docs drift scripts, at v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: egov-sofa/software-factory
          ref: v1
          path: .factory-tools
          token: ${{ steps.factory.outputs.token || github.token }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: python -I -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.3"   # -I: no module from the checkout

      - name: Scan every repository
        env:
          DOCS_DRIFT_TOKEN_EXAMPLE_ORG: ${{ steps.example_org.outputs.token }}
          DOCS_DRIFT_TOKEN_OTHER_ORG: ${{ steps.other_org.outputs.token }}
        run: >-
          python -I .factory-tools/scripts/docs_drift.py dashboard --registry registry.yml
          --json "$RUNNER_TEMP/dashboard.json" --markdown "$RUNNER_TEMP/dashboard.md"
          && cat "$RUNNER_TEMP/dashboard.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dashboard issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python -I .factory-tools/scripts/docs_drift_issue.py --title "Documentation dashboard"
          --report "$RUNNER_TEMP/dashboard.json" --body "$RUNNER_TEMP/dashboard.md"
