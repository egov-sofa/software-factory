# Claude reviews every pull request of the factory, following .claude/skills/pr-review/SKILL.md.
# Uses the factory's own reusable workflow from this repository. Off until the variable CLAUDE_REVIEW_ENABLED is
# true; setup in docs/SHARED-SERVICES.md ("Turning on the Claude services").
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:   # each review costs API credit
      - "**/*.png"

concurrency:
  # a new push to the same pull request replaces the review still running
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-claude-review.yml
    with:
      federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      debug: ${{ vars.CLAUDE_REVIEW_DEBUG == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
