# Answers a pull request comment that starts with @claude (write access only). Skipped until the variable
# ANTHROPIC_MENTION_FEDERATION_RULE_ID is set; setup in docs/SHARED-SERVICES.md.
name: Claude on demand

on:
  issue_comment:
    types: [created]

jobs:
  answer:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-claude-mention.yml
    with:
      federation-rule-id: ${{ vars.ANTHROPIC_MENTION_FEDERATION_RULE_ID }}
      organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      debug: ${{ vars.CLAUDE_REVIEW_DEBUG == 'true' }}
