# Tests the factory itself: scaffolds a project from every template and runs its checks.
# If a change to a template or script breaks project creation, this goes red.
name: Factory self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh scripts/hooks/* templates/generic/scripts/*.sh

  guard:
    name: Content guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests of scripts/check_content.py
        run: python -m unittest discover -s scripts/tests -v
      - name: The factory itself is clean
        run: python scripts/check_content.py --all

  scaffold:
    name: Scaffold ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [typescript, python, generic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config --global user.name "factory-selftest"
          git config --global user.email "selftest@example.com"

      - name: Scaffold project
        run: bash scripts/new-project.sh selftest-app ${{ matrix.template }} --dir "$RUNNER_TEMP" --owner example

      - name: No placeholders left behind
        # factory placeholders are {{UPPER_CASE}}; GitHub expressions (${{ ... }}) in workflows are expected
        run: |
          if grep -rnE "\{\{[A-Z_]+\}\}" "$RUNNER_TEMP/selftest-app" --exclude-dir=.git; then
            echo "::error::Unreplaced placeholders found"; exit 1
          fi

      - name: Content guard and hooks are in place
        working-directory: ${{ runner.temp }}/selftest-app
        run: |
          test "$(git config core.hooksPath)" = scripts/hooks
          test -x scripts/hooks/pre-commit && test -x scripts/hooks/commit-msg
          python3 scripts/check_content.py --all

      - name: Run project checks
        working-directory: ${{ runner.temp }}/selftest-app
        run: |
          case "${{ matrix.template }}" in
            typescript) npm install && npm run lint && npm run build && npm test ;;
            python)     pip install -e ".[dev]" && ruff check . && ruff format --check . && pytest ;;
            generic)    bash scripts/check.sh ;;
          esac
