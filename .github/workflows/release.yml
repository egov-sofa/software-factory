# Publishes a factory release and moves the major tag (v1) to it.
# Projects call the factory's workflows and actions at @v1, so moving v1 is what rolls a release out to them.
# A breaking change gets a new major version (v2.0.0): v1 then stays where it was until each project moves.
#
# Two ways to release (see docs/SHARED-SERVICES.md):
#   - From GitHub, no terminal: Actions → Release → Run workflow, on main, with the version (v1.2.0).
#     The workflow creates the tag itself.
#   - From a terminal: bash scripts/release-notes.sh v1.2.0 (preview), then
#     git tag -a v1.2.0 -m "Short description" && git push origin v1.2.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v1.2.0 (v1.2.0-rc.1 for a pre-release). Run it on main."
        required: true
        type: string

permissions:
  contents: write   # create the tag and the release, and move the major tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # the release's tag: the pushed tag, or the version typed in when started by hand
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history and every tag: to check the tag is on main and to write the notes

      - name: Version is valid
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version like v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi

      - name: Create the tag (started by hand)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run the release on main, not $GITHUB_REF_NAME"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists; pick the next version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          # a tag pushed with GITHUB_TOKEN starts no workflow, so this run does not start a second one
          git push origin "refs/tags/$TAG"

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $TAG is not on main; tag the merged commit on main"
            exit 1
          }

      - name: Release notes
        run: |
          bash scripts/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.0-rc.1 and similar are pre-releases: published, but the major tag does not move
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then pre=""; else pre="--prerelease"; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md $pre

      - name: Move the major tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pre-release: the major tag stays where it is" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          major="${TAG%%.*}"   # v1.2.0 -> v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major -> $TAG" "$GITHUB_SHA"
          # a tag pushed with GITHUB_TOKEN starts no workflow, and v1 does not match this workflow's tag pattern
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
