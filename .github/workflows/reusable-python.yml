# Reusable CI for Python projects (pyproject.toml with a [dev] extra).
# Called from a project's ci.yml with:
#   uses: <owner>/software-factory/.github/workflows/reusable-python.yml@main
name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: "3.12"
      working-directory:
        description: Folder containing pyproject.toml
        type: string
        default: "."

permissions:
  contents: read

jobs:
  check:
    name: Lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
