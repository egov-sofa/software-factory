# Factory update: proposes the newest software-factory release of the project's major version as a pull request,
# every week, so a project does not drift from the factory silently.
# Shared service of the software factory: see docs/SHARED-SERVICES.md, "Updates". The caller is
# templates/_shared/.github/workflows/factory-update.yml; it needs contents: write, pull-requests: write and
# issues: write. While the factory is public, no secret beyond GITHUB_TOKEN. Once it is internal or private
# (docs/PRIVATE-FACTORY-OPTIONS.md, option A), the caller passes a GitHub App's client ID and private key: the action
# makes a token that can only read the factory, for the clone alone.
#
# What it does (scripts/factory_update_job.py):
#   - skips with a notice when the project has no .factory/answers.yml;
#   - clones the factory named in the answers file (without a token, or with the App's read-only token when given)
#     and runs this action's own
#     scripts/factory_update.py on the checkout; nothing from the project runs, and git runs with hooks off;
#   - does nothing when an open pull request already proposes the newest release; when the project is at or past
#     it, closes the open update pull requests and issue;
#   - otherwise pushes branch factory-update/<version> and opens a pull request (a draft when it has conflicts),
#     closing older update pull requests. Changes to .github/workflows/ are left out (GITHUB_TOKEN cannot push them)
#     and listed, with "run /factory-update locally"; _workflows_from in the answers file records the commit they
#     are still at, so a merged update is not proposed again;
#   - when the repository does not let GitHub Actions open pull requests, or only workflow files change, it keeps
#     one issue labelled factory-update up to date instead.
# A pull request opened with GITHUB_TOKEN starts no workflows: its body says how to start CI.
name: Factory update
description: Propose the newest software-factory release as a pull request (or an issue when that is not allowed)
inputs:
  factory-app-client-id:
    description: >-
      Client ID of a GitHub App installed on the factory's owner with Contents read on the factory. Needed once the
      factory is internal or private; leave empty while it is public.
    required: false
    default: ""
  factory-app-private-key:
    description: The private key of that GitHub App (a secret).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # the token is given to the push and gh calls only, through the environment

    - name: Look for the answers file
      id: answers
      shell: bash
      run: |
        if [ -f .factory/answers.yml ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::no .factory/answers.yml: this project does not record its factory version; run /factory-update locally once (it writes the file), then this job keeps it current"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    # The factory this project follows, from the answers file, for the read token below
    - name: Name the factory
      id: factory
      if: ${{ steps.answers.outputs.found == 'true' && inputs.factory-app-client-id != '' }}
      shell: bash
      run: |
        src=$(python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); import factory_update as fu; print(fu.read_answers(".")["_src_path"])' "$GITHUB_ACTION_PATH/../../../scripts")
        if [[ ! "$src" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::.factory/answers.yml: _src_path '$src' is not an owner/repository name"
          exit 1
        fi
        echo "owner=${src%%/*}" >> "$GITHUB_OUTPUT"
        echo "repository=${src#*/}" >> "$GITHUB_OUTPUT"

    # A token that can only read the factory, revoked when the job ends
    - name: Token to read the factory
      id: factory-token
      if: ${{ steps.answers.outputs.found == 'true' && inputs.factory-app-client-id != '' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.factory-app-client-id }}
        private-key: ${{ inputs.factory-app-private-key }}
        owner: ${{ steps.factory.outputs.owner }}
        repositories: ${{ steps.factory.outputs.repository }}
        permission-contents: read

    # No project token in this step; the factory's read token (when given) goes to the clone alone and leaves the
    # environment before anything reads the project. python3 -I keeps the checkout off the import path; the scripts
    # are this action's own, at the pinned tag.
    - name: Prepare the update
      if: ${{ steps.answers.outputs.found == 'true' }}
      shell: bash
      env:
        FACTORY_TOKEN: ${{ steps.factory-token.outputs.token }}
      run: python3 -I "$GITHUB_ACTION_PATH/../../../scripts/factory_update_job.py" prepare --workdir "$RUNNER_TEMP/factory-update"

    - name: Open or refresh the pull request
      if: ${{ steps.answers.outputs.found == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 -I "$GITHUB_ACTION_PATH/../../../scripts/factory_update_job.py" publish --workdir "$RUNNER_TEMP/factory-update"
